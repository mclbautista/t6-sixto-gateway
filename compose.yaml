# Always-on deployment. Deploy: `git pull && GATEWAY_TAG=$(git rev-parse --short HEAD) \
#   docker compose up -d --build` (the tag keeps the previous image for rollback).
# Rollback: `GATEWAY_TAG=<previous> docker compose up -d` (see "Rollback" in the README).
# The health check lives in the Dockerfile (GET /healthz).
services:
  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    restart: unless-stopped
    env_file: .env.tailscale
    environment:
      TS_EXTRA_ARGS: --advertise-tags=tag:t6-gateway
      TS_HOSTNAME: t6-gateway
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  gateway:
    build: .
    image: sixto-gateway:${GATEWAY_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    ports:
      - "8780:8780"                 # LAN only; never expose to the internet
    volumes:
      # A named volume, inside the Docker VM. Never bind-mount a host folder here: SQLite's
      # locks do not hold across a macOS bind mount (t6-jo-watchdog#131; README "Database
      # storage and backups").
      - gateway_data:/app/data
      - ./config.yaml:/app/config.yaml:ro

volumes:
  tailscale_state:
  # External on purpose: `docker compose up` fails until the volume exists, so a deploy can
  # never start on a silently empty database, and `docker compose down -v` cannot delete it.
  # Create it once: `docker volume create sixto-gateway-data`.
  gateway_data:
    external: true
    name: sixto-gateway-data
