# Non-secret configuration. Copy to config.yaml (mounted read-only into the container).
# Secrets go in .env, never here: TELEGRAM_BOT_TOKEN, NOTION_API_KEY (the same value as in
# t6-sixto-watchdog) and one <MODULE>_SECRET per module (each at least 32 characters). Every key is validated at boot; a bad value fails the boot.

listen: { host: 0.0.0.0, port: 8780 }
telegram:
  poll_timeout: 50                              # seconds, Telegram long poll (0..50)
  allowed_updates: [message, edited_message, callback_query]    # callback_query: card buttons
  polling: true                                 # false = serve the API only (cutover step 1)
notion:
  contacts_data_source_id: 77b2a701-71db-4e88-a694-37f07303e77e   # the Contacts data source
  version: "2026-03-11"                         # Notion-Version header, pinned
onboarding:
  approver: 100000001                           # Telegram user id that gets the /start cards
  matching: shadow                              # shadow: own matching decides, t6-core's is compared in the audit log; core: t6-core decides
  summary_time: "09:00"                         # HH:MM Asia/Manila: the daily summary DM to the approver
  expected:                                     # handles that should be approved; the rest show as "still missing"
    - starling42
    - silverotter
    - amberfinch
    - cloudbadger
    - mistyheron
    - cedarfox
    - moonfern
    - replace_with_member_handle               # FILL IN: another member’s Telegram handle
retention_days: 30
database_path: ./data/gateway.db
modules:                                        # each module authenticates with its own secret
  watchdog: { secret_env: WATCHDOG_SECRET }
  shift: { secret_env: SHIFT_SECRET }           # JO shift reports (https://github.com/mclbautista/t6-sixto-gateway/issues/41)
  netops: { secret_env: NETOPS_SECRET }         # t6-netops notifications; its own secret, never the Telegram bot token
  # Taps on a module's buttons and its commands: delivery "pull" (default) = the module reads
  # them from /updates; "push" = the gateway posts each one to push_url with the module's
  # secret, retrying until it is accepted. t6core is the t6-core webhooks server and Frame.io worker (README: "Messages
  # from t6-core"); its taps go to the server's tailnet-only tap endpoint
  # (mclbautista/t6-core#21, allowed by mclbautista/t6-netops#3).
  t6core:
    secret_env: T6CORE_SECRET
    delivery: push
    push_url: "http://100.64.0.1:8791/tap"   # FILL IN: the VPS tailnet IPv4, port and path
commands:                                       # /jo arrives in phase 5
  whereami:                                     # built-in: answered by the gateway, no module
    builtin: true
    allow: [chat_ids]
    description: Show this chat's id and topic id
  project:                                      # pushed to t6core (README: "Project Codes and rotation")
    module: t6core
    allow: [operators]
    description: Project Codes and rotation
groups:
  approvers: [100000001]                       # Telegram user ids
  # `operators` (who may send /project) is not listed here: the gateway reads t6-core's
  # T6_OPERATOR_IDS from its environment (.env), so operator ids are defined once.
  chat_ids:                                     # who may ask /whereami
    - 100000001                                 # Example approver
    - 100000002                                 # Moonfern
    # FILL IN at deploy: another member’s Telegram user id
routes:
  # FILL IN: copy the intake chat and topic ids from the watchdog's config.yaml
  # (intake_chat_id / intake_topic_id). The operator supplies the deployed values; they are not
  # stored in any repo, so the real values go into the deployed config.yaml.
  - { chat: -1000000000000, topic: 7, module: watchdog }
