# Non-secret configuration. Copy to config.yaml (mounted read-only into the container).
# Secrets go in .env, never here: TELEGRAM_BOT_TOKEN, NOTION_API_KEY (the same value as in
# t6-jo-tg-ntn) and one <MODULE>_SECRET per module (each at least 32 characters). Every key is validated at boot; a bad value fails the boot.

listen: { host: 0.0.0.0, port: 8780 }
telegram:
  poll_timeout: 50                              # seconds, Telegram long poll (0..50)
  allowed_updates: [message, edited_message, callback_query]    # callback_query: card buttons
  polling: true                                 # false = serve the API only (cutover step 1)
notion:
  contacts_data_source_id: 77b2a701-71db-4e88-a694-37f07303e77e   # the Contacts data source
  version: "2026-03-11"                         # Notion-Version header, pinned
onboarding:
  approver: 274983989                           # Telegram user id that gets the /start cards
  summary_time: "09:00"                         # HH:MM Asia/Manila: the daily summary DM to the approver
  expected:                                     # handles that should be approved; the rest show as "still missing"
    - mclb22
    - eyadane
    - jamagne
    - hmmkayy
    - alecgaba
    - dentiamson
    - leizette
    - replace_with_pios_handle                  # FILL IN: Pio's Telegram handle
retention_days: 30
database_path: ./data/gateway.db
modules:                                        # each module authenticates with its own secret
  watchdog: { secret_env: WATCHDOG_SECRET }
commands: {}                                    # phase 1 registers none; /jo arrives in phase 5
groups:
  cyril: [274983989]                            # Telegram user ids
routes:
  # FILL IN: copy the intake chat and topic ids from the watchdog's config.yaml
  # (intake_chat_id / intake_topic_id). Cyril approved copying them as they are; they are not
  # stored in any repo, so the real values go into the deployed config.yaml.
  - { chat: -1000000000000, topic: 1, module: watchdog }
