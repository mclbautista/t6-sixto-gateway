[project]
name = "sixto-gateway"
version = "0.1.0"
description = "Sixto gateway: sole holder of the @sixto_t6bot token; modules pull updates over HTTP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sixto_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["sixto_gateway"]
ignore_missing_imports = true
check_untyped_defs = true
